<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Employee | AAA College</title>
  <style>
    body { font: 16px Arial, sans-serif; background: #f6f7fb; color: #202b3c; margin: 0; padding: 24px; }
    main { max-width: 650px; margin: auto; padding: 24px; background: white; border-radius: 12px; }
    h1 { margin-top: 0; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: grid; gap: 6px; font-size: 14px; }
    input, select { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #ccd2dc; border-radius: 6px; }
    button { padding: 11px 15px; border: 0; border-radius: 6px; background: #4864e8; color: white; cursor: pointer; }
    .note, .buttons { grid-column: 1 / -1; }
    .note { color: #68778c; font-size: 12px; }
    @media (max-width: 520px) { form { grid-template-columns: 1fr; } .note, .buttons { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <h1>Add Employee</h1>
    <p>AAA College of Engineering and Technology · Demo form</p>

    <form id="employee-form">
      <label>Employee ID <input name="employeeId" placeholder="e.g. ACET-006" required></label>
      <label>Full name <input name="name" autocomplete="off" required></label>
      <label>Department
        <select name="department" required>
          <option value="">Choose a department</option>
          <option>Computer Science</option>
          <option>Mechanical</option>
          <option>Electrical</option>
          <option>Civil</option>
          <option>Administration</option>
        </select>
      </label>
      <label>Designation <input name="designation" required></label>
      <label>Work email <input name="email" type="email"></label>
      <label>Employment type
        <select name="employmentType">
          <option>Full-time
