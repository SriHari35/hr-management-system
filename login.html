<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Login | AAA College</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef3ff, #f6f7fb);
      }
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .login-box {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid #e8ebf1;
        border-radius: 18px;
        padding: 26px;
        box-shadow: 0 10px 25px rgba(36, 54, 86, 0.08);
      }
      .login-box h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      .login-subtitle {
        margin: 0 0 18px;
        color: #8290a3;
        font-size: 13px;
      }
      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 12px;
        color: #55657d;
        font-weight: 600;
      }
      .field input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #dfe4ea;
        border-radius: 8px;
        font-size: 14px;
      }
      .login-btn {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        background: #4864e8;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .login-btn:hover {
        background: #3b53d2;
      }
      .login-footer {
        margin-top: 16px;
        text-align: center;
        color: #8290a3;
        font-size: 11px;
      }
      .demo-link {
        color: #4864e8;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-box">
        <h1>HR Login</h1>
        <p class="login-subtitle">AAA College of Engineering and Technology</p>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" value="hradmin" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" value="admin123" />
        </div>

        <button class="login-btn" onclick="window.location.href='index.html'">Login</button>

        <div class="login-footer">
          Demo only · <a class="demo-link" href="index.html">Open dashboard</a>
        </div>
      </div>
    </div>
  </body>
</html>
